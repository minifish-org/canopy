graphhopper:
  datareader.file: singapore.osm.pbf
  graph.location: graph-cache

  profiles:
    - name: bike
      custom_model_files: [bike.json, pcn.json]

  # Keep CH and LM off. GraphHopper round_trip needs flexible mode.
  profiles_ch: []
  profiles_lm: []

  graph.encoded_values: bike_priority, bike_access, roundabout, bike_average_speed, bike_road_access, mtb_rating, hike_rating, country, road_class, bike_network

  prepare.min_network_size: 200
  prepare.subnetworks.threads: 1
  routing.snap_preventions_default: tunnel, bridge, ferry
  routing.non_ch.max_waypoint_distance: 1000000

  # Do not ignore cycleway/path/footway. Only drop major motor roads that are
  # never useful for the low-car PCN profile.
  import.osm.ignored_highways: motorway,trunk

  graph.dataaccess.default_type: RAM_STORE

server:
  application_connectors:
    - type: http
      port: 8989
      bind_host: localhost
      max_request_header_size: 50k
  request_log:
    appenders: []
  admin_connectors:
    - type: http
      port: 8990
      bind_host: localhost

logging:
  appenders:
    - type: file
      time_zone: UTC
      current_log_filename: logs/graphhopper.log
      log_format: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
      archive: true
      archived_log_filename_pattern: ./logs/graphhopper-%d.log.gz
      archived_file_count: 30
      never_block: true
    - type: console
      time_zone: UTC
      log_format: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  loggers:
    "com.graphhopper.osm_warnings":
      level: DEBUG
      additive: false
      appenders:
        - type: file
          currentLogFilename: logs/osm_warnings.log
          archive: false
          logFormat: "[%level] %msg%n"
